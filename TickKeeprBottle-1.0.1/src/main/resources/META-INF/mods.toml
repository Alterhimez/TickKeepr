modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional, not mandatory: this mod only *acts* on tiab's item when it finds
# one, purely via registry name + NBT, so it's harmless (just inert) without
# tiab installed rather than refusing to load.
[[dependencies.${mod_id}]]
    modId="tiab"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
