org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Stops Gradle from picking up whatever Java installations already happen to
# be on this machine (e.g. a JRE-only Java 8 install used just for playing
# Minecraft) for the toolchain build below - forces it to always use the one
# the Foojay plugin downloads itself, which is guaranteed to be a real JDK.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

